
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>碩康集團｜主持人控制台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, "Noto Sans TC", sans-serif;
      color: #fff;
      background: #11152b;
    }
    main { max-width: 800px; margin: auto; }
    .panel, .card {
      background: #202544;
      border: 1px solid #41486e;
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
    }
    h1 { font-size: 26px; }
    .muted { color: #c3c7e7; }
    .count { font-size: 42px; font-weight: 800; }
    .player {
      padding: 12px 0;
      border-bottom: 1px solid #41486e;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .player:last-child { border-bottom: 0; }
    button {
      padding: 12px 18px;
      margin: 4px;
      border: 0;
      border-radius: 10px;
      background: #8165ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #565b80;
      background: #10142b;
      color: white;
      font-size: 16px;
      width: 100%;
    }
    #message { white-space: pre-wrap; line-height: 1.6; }
  </style>
</head>
<body>
<main>
 
<!-- 主持人登入畫面 -->
<div id="loginPanel">
  <h1>⚡ 碩康集團｜主持人登入</h1>
  <p class="muted">英雄集結搶答賽</p>

  <div class="card" style="margin-top:20px;">
    <h2>🔐 主持人權限驗證</h2>

    <input
      type="password"
      id="hostPassword"
      placeholder="請輸入主持人密碼"
      style="width:100%;padding:14px;margin:10px 0;border-radius:8px;box-sizing:border-box;"
    >

    <button id="loginBtn" onclick="loginHost()">
      🔓 登入主持人控制台
    </button>

    <p id="loginMessage" class="muted">
      請輸入主持人密碼
    </p>
  </div>
</div>

<!-- 主持人遊戲控制台：登入後才顯示 -->
<div id="hostPanel" style="display:none;">
  
  <div id="hostLoginStatus" style="
  background: #e8f5e9;
  color: #2e7d32;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-weight: bold;
">
 <div id="hostTokenCountdown" style="
  color: #555;
  font-size: 14px;
  margin-bottom: 18px;
">
  ⏳ 登入期限計算中...
</div>
  🟢 主持人已登入
</div>

  <h1>⚡ 碩康集團｜主持人控制台</h1>
  <p class="muted">英雄集結搶答賽</p>

  <div class="card" style="margin-top:20px;">
    <h2>🎮 遊戲控制</h2>

    <button id="startBtn" onclick="startGame()">
      🚀 開始遊戲
    </button>

    <button id="nextBtn" onclick="nextQuestion()">
      ➡️ 下一題
    </button>

    <button id="pauseBtn" onclick="pauseGame()" style="background:#e09b28;">
      ⏸️ 暫停遊戲
    </button>

    <button id="resumeBtn" onclick="resumeGame()" style="background:#159b78;">
      ▶️ 繼續遊戲
    </button>

    <button id="endBtn" onclick="endGame()" style="background:#dc3545;">
      🛑 結束遊戲
    </button>

    <button id="resetBtn" onclick="resetGame()" style="background:#6c42a5;">
      🔄 重新開始遊戲
    </button>

    <p id="controlMessage" class="muted">
      等待主持人開始遊戲
    </p>

    <button onclick="logoutHost()" style="background:#555;">
      🚪 登出主持人帳號
    </button>
  </div>
</div>


  <section class="panel">
    <label for="joinCode">遊戲代碼</label>
    <input id="joinCode" value="SK2027TEST">
    <p><button id="refreshButton">立即更新名單</button></p>
    <div id="message">正在連線……</div>
  </section>

  <section class="panel">
    <div class="muted">目前遊戲狀態</div>
    <div id="status">讀取中</div>
    <div class="muted">已加入玩家</div>
    <div class="count" id="count">—</div>
    <div id="updated" class="muted"></div>
  </section>

  <section class="panel">
    <h2>🏆 英雄即時排行榜</h2>
    <div id="players">正在載入排行榜……</div>
  </section>
</main>

<script>
const API_URL =
  'https://krtktutoycdfcskhpmam.supabase.co/functions/v1/game-api';

const PUBLISHABLE_KEY =
  'sb_publishable_kgSXj6Zbk7QpG4Ien7q6TA_IVfAd-wf';
// 主持人登入憑證剩餘時間倒數
let hostCountdownTimer = null;

function updateHostCountdown() {
  const countdown = document.getElementById('hostTokenCountdown');

  if (!countdown) return;

  const expiry = Number(
    sessionStorage.getItem('host_token_expiry')
  );

if (!expiry || Date.now() >= expiry) {
  logoutHost();
  return;
}

  const remaining = expiry - Date.now();

  const hours = Math.floor(remaining / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  countdown.textContent =
    `⏳ 登入憑證剩餘時間：${hours} 小時 ${minutes} 分 ${seconds} 秒`;
}

// 啟動倒數，每秒更新
function startHostCountdown() {
  if (hostCountdownTimer) {
    clearInterval(hostCountdownTimer);
  }

  updateHostCountdown();

  hostCountdownTimer = setInterval(
    updateHostCountdown,
    1000
  );
}

// 停止倒數
function stopHostCountdown() {
  if (hostCountdownTimer) {
    clearInterval(hostCountdownTimer);
    hostCountdownTimer = null;
  }
}
// 主持人登入狀態管理
function showHostPanel() {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('hostPanel').style.display = 'block';

  startHostCountdown();
}

function showLoginPanel(message = '請輸入主持人密碼') {
  document.getElementById('hostPanel').style.display = 'none';
  document.getElementById('loginPanel').style.display = 'block';
  document.getElementById('loginMessage').textContent = message;
}

// 主持人登入
async function loginHost() {
  const password = document.getElementById('hostPassword').value;
  const message = document.getElementById('loginMessage');
  const button = document.getElementById('loginBtn');

  if (!password) {
    message.textContent = '請輸入主持人密碼';
    return;
  }

  button.disabled = true;
  message.textContent = '正在驗證登入……';

  try {
    const response = await hostFetch({
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        action: 'host_login',
        host_password: password
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success || !result.token) {
      throw new Error(result.message || '登入失敗');
    }

    // 保存登入憑證及到期時間，不保存密碼
    sessionStorage.setItem('host_token', result.token);
    sessionStorage.setItem(
      'host_token_expiry',
      String(Date.now() + result.expires_in * 1000)
    );

    document.getElementById('hostPassword').value = '';
    showHostPanel();

  } catch (error) {
    message.textContent = '登入失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
}

// 主持人登出
function logoutHost() {
  // 停止登入倒數
  stopHostCountdown();

  // 清除登入憑證
  sessionStorage.removeItem('host_token');
  sessionStorage.removeItem('host_token_expiry');

  // 返回登入畫面
  showLoginPanel('已登出，請重新登入');
}

// 網頁重新整理時，檢查登入期限
function restoreHostLogin() {
  const token = sessionStorage.getItem('host_token');
  const expiry = Number(
    sessionStorage.getItem('host_token_expiry')
  );

  if (token && expiry && Date.now() < expiry) {
    showHostPanel();
  } else {
    logoutHost();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', restoreHostLogin);
} else {
  restoreHostLogin();
}
// 主持人專用 API：自動附加登入憑證
window.hostFetch = async function(options) {
  const token = sessionStorage.getItem('host_token');
  const expiry = Number(
    sessionStorage.getItem('host_token_expiry')
  );

  if (!token || !expiry || Date.now() >= expiry) {
    logoutHost();
    throw new Error('主持人登入已逾期，請重新登入');
  }

  const body = JSON.parse(options.body || '{}');
  body.host_token = token;

const response = await fetch(API_URL, {
  ...options,
  body: JSON.stringify(body)
});
  
  if (response.status === 401) {
    logoutHost();
    throw new Error('主持人登入已失效，請重新登入');
  }

return response;
};

// 開始遊戲
async function startGame() {
  const code = document.getElementById('joinCode').value.trim();
  const message = document.getElementById('controlMessage');
  const button = document.getElementById('startBtn');

  if (!code) {
    message.textContent = '請先輸入遊戲代碼';
    return;
  }

  if (!confirm('確定要開始遊戲嗎？')) return;

  button.disabled = true;
  message.textContent = '正在啟動遊戲...';

  try {
　　const response = await fetch(API_URL, {
 　　 method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        action: 'start',
        join_code: code
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || '啟動失敗');
    }

    message.textContent = '🎉 遊戲已開始！';
    loadPlayers();

  } catch (error) {
    message.textContent = '啟動失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
}

// 切換下一題
async function nextQuestion() {
  const code = document.getElementById('joinCode').value.trim();
  const message = document.getElementById('controlMessage');
  const button = document.getElementById('nextBtn');

  if (!code) {
    message.textContent = '請先輸入遊戲代碼';
    return;
  }

  if (!confirm('確定要切換至下一題嗎？')) return;

  button.disabled = true;
  message.textContent = '正在切換下一題……';

  try {
    const response = await hostFetch({
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        action: 'next',
        join_code: code
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || '切換失敗');
    }

    message.textContent =
      '🎉 已切換至第 ' + result.current_question + ' 題！';

    loadPlayers();

  } catch (error) {
    message.textContent = '切換失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
}
// 暫停遊戲
async function pauseGame() {
  await controlGameAction('pause', '正在暫停遊戲……', '⏸️ 遊戲已暫停！');
}

// 繼續遊戲
async function resumeGame() {
  await controlGameAction('resume', '正在繼續遊戲……', '▶️ 遊戲已繼續！');
}

// 共用遊戲控制 API
async function controlGameAction(action, loadingText, successText) {
  const code = document.getElementById('joinCode').value.trim();
  const message = document.getElementById('controlMessage');
  const buttonId = action === 'pause' ? 'pauseBtn' : 'resumeBtn';
  const button = document.getElementById(buttonId);

  if (!code) {
    message.textContent = '請先輸入遊戲代碼';
    return;
  }

  const confirmText = action === 'pause'
    ? '確定要暫停遊戲嗎？'
    : '確定要繼續遊戲嗎？';

  if (!confirm(confirmText)) return;

  button.disabled = true;
  message.textContent = loadingText;

  try {
    const response = await hostFetch({
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        action: action,
        join_code: code
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || '操作失敗');
    }

    message.textContent = successText;
    await loadPlayers();

  } catch (error) {
    message.textContent = '操作失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
}  
// 結束遊戲
async function endGame() {
  const code = document.getElementById('joinCode').value.trim();
  const message = document.getElementById('controlMessage');
  const button = document.getElementById('endBtn');

  if (!code) {
    message.textContent = '請先輸入遊戲代碼';
    return;
  }

  if (!confirm('確定要結束本場遊戲嗎？結束後玩家將無法繼續作答！')) {
    return;
  }

  button.disabled = true;
  message.textContent = '正在結束遊戲……';

  try {
    const response = await hostFetch({
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        action: 'end',
        join_code: code
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || '結束遊戲失敗');
    }

    message.textContent = '🏁 本場遊戲已結束！';
    loadPlayers();

  } catch (error) {
    message.textContent = '結束遊戲失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
}
  // 重新開始遊戲
async function resetGame() {
  const code = document.getElementById('joinCode').value.trim();
  const message = document.getElementById('controlMessage');
  const button = document.getElementById('resetBtn');

  if (!code) {
    message.textContent = '請先輸入遊戲代碼';
    return;
  }

  if (!confirm(
    '⚠️ 確定要重新開始遊戲嗎？\n\n' +
    '這將會清除：\n' +
    '1. 所有已加入的玩家及暱稱\n' +
    '2. 所有玩家的總分及答對題數\n' +
    '3. 本場所有作答紀錄\n\n' +
    '原本題庫會保留，玩家必須重新加入！'
  )) {
    return;
  }

  button.disabled = true;
  message.textContent = '正在清除本場遊戲資料……';

  try {
    const response = await hostFetch({
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        action: 'reset',
        join_code: code
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || '重新開始遊戲失敗');
    }

    message.textContent =
      '🔄 遊戲已重新設定完成！\n等待玩家重新加入。';

    // 更新主持人畫面上的玩家名單
    await loadPlayers();

  } catch (error) {
    message.textContent = '重新開始失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
}
// 讀取玩家與排行榜
async function loadPlayers() {
  const message = document.getElementById('message');
  const button = document.getElementById('refreshButton');

  button.disabled = true;

  try {
    const code = document.getElementById('joinCode').value.trim();

    if (!code) throw new Error('請輸入遊戲代碼');

    const headers = { 'apikey': PUBLISHABLE_KEY };

    const sessionResponse = await fetch(
      API_URL + '?join_code=' + encodeURIComponent(code),
      { headers }
    );

    const sessionResult = await sessionResponse.json();

    if (!sessionResponse.ok || !sessionResult.success) {
      throw new Error(sessionResult.message || '無法讀取遊戲場次');
    }

    const session = sessionResult.session;

    const playersResponse = await fetch(
      API_URL + '?action=players&join_code=' + encodeURIComponent(code),
      { headers }
    );

    const playersResult = await playersResponse.json();

    if (!playersResponse.ok || !playersResult.success) {
      throw new Error(playersResult.message || '無法讀取玩家名單');
    }

    document.getElementById('status').textContent =
      session.status === 'lobby' ? '等待玩家中' :
      session.status === 'active' ? '遊戲進行中' :
      session.status === 'paused' ? '遊戲暫停' :
      session.status === 'ended' ? '遊戲已結束' : session.status;

    const players = playersResult.players || [];

    players.sort((a, b) => b.total_score - a.total_score);

    document.getElementById('count').textContent = players.length;
    document.getElementById('players').innerHTML = '';

    if (players.length === 0) {
      document.getElementById('players').textContent = '目前尚無玩家';
    } else {
      players.forEach((player, index) => {
        const row = document.createElement('div');
        row.className = 'player';

        const name = document.createElement('span');
        const medal = ['🥇', '🥈', '🥉'][index] || '🏅';

        name.textContent =
          `${medal} ${index + 1}. ${player.nickname}`;

        const score = document.createElement('span');

        score.textContent =
          `${player.total_score || 0} 分｜答對 ${player.correct_count || 0} 題`;

        row.append(name, score);
        document.getElementById('players').appendChild(row);
      });
    }

    document.getElementById('updated').textContent =
      '最後更新：' + new Date().toLocaleTimeString('zh-TW');

    message.textContent = '更新成功';

  } catch (error) {
    message.textContent = '讀取失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
}

document.getElementById('refreshButton')
  .addEventListener('click', loadPlayers);

loadPlayers();
setInterval(loadPlayers, 3000);
</script>
</body>
</html>
