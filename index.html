
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <title>碩康集團英雄集結搶答賽</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 24px;
      font-family: system-ui, "Noto Sans TC", sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #34346b, #11152b 65%);
    }
    main {
      width: 100%; max-width: 420px; padding: 28px 22px;
      border: 1px solid #55547c; border-radius: 24px;
      background: rgba(24, 28, 55, .96);
      box-shadow: 0 20px 60px #0005;
    }
    .symbol { text-align: center; font-size: 46px; }
    h1 { text-align: center; font-size: 25px; margin: 8px 0; }
    .sub { text-align: center; color: #c3c7e7; margin-bottom: 26px; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid #565b80; background: #10142b;
      color: white; font-size: 17px; outline-offset: 3px;
    }
    button {
      width: 100%; padding: 15px; margin-top: 22px;
      border: 0; border-radius: 12px; background: #8165ff;
      color: white; font-size: 18px; font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      min-height: 48px; margin-top: 18px; text-align: center;
      line-height: 1.6; white-space: pre-wrap; color: #e1e3ff;
    }
    .hidden { display: none; }
#questionPanel {
  margin-top: 24px;
}

.option {
  padding: 15px;
  margin: 12px 0;
  border: 1px solid #7775a8;
  border-radius: 12px;
  background: #292d50;
  font-size: 16px;
  line-height: 1.5;
}

#questionText {
  line-height: 1.6;
  margin: 18px 0;
}

#questionMessage {
  text-align: center;
  color: #c3c7e7;
}
  </style>
</head>
<body>
  <main>
    <div class="symbol">⚡</div>
    <h1>英雄集結搶答賽</h1>
    <p class="sub">碩康集團 · 歡迎加入挑戰</p>

    <form id="joinForm">
      <label for="joinCode">遊戲代碼</label>
      <input id="joinCode" value="SK2026" maxlength="30"
        autocomplete="off" required>

      <label for="nickname">玩家暱稱（最多 20 字）</label>
      <input id="nickname" maxlength="20" autocomplete="nickname"
        placeholder="請輸入你的暱稱" required>

      <button id="joinButton" type="submit">加入遊戲</button>
    </form>
<section id="questionPanel" class="hidden">
  <p class="sub">⚡ 英雄挑戰開始！</p>
  <h2 id="questionNumber">第 1 題</h2>
  <h2 id="questionText"></h2>

  <div id="options">
    <div class="option" id="optionA"></div>
    <div class="option" id="optionB"></div>
    <div class="option" id="optionC"></div>
    <div class="option" id="optionD"></div>
  </div>

  <p id="questionMessage">請仔細閱讀題目！</p>
</section>
    <section id="waiting" class="hidden">
      <h2 id="welcome"></h2>
      <p>已成功加入，請等待主持人開始遊戲。</p>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    const API_URL =
      'https://krtktutoycdfcskhpmam.supabase.co/functions/v1/game-api';

    const form = document.getElementById('joinForm');
    const button = document.getElementById('joinButton');
    const message = document.getElementById('message');
let pollTimer = null;
let isChecking = false;
    form.addEventListener('submit', async (event) => {
      async function checkGameQuestion(joinCode) {
  if (isChecking) return;
  isChecking = true;

  try {
    const headers = {
      'apikey': 'sb_publishable_kgSXj6Zbk7QpG4Ien7q6TA_IVfAd-wf'
    };

    const sessionResponse = await fetch(
      `${API_URL}?join_code=${encodeURIComponent(joinCode)}`,
      { headers }
    );

    const sessionResult = await sessionResponse.json();

    if (!sessionResult.success) return;

    const status = sessionResult.session.status;

    if (status === 'lobby') {
      document.getElementById('questionMessage').textContent =
        '等待主持人開始遊戲…';
      return;
    }

    if (status === 'paused') {
      document.getElementById('questionMessage').textContent =
        '⏸ 遊戲暫停中，請稍候！';
      return;
    }

    if (status === 'ended') {
      document.getElementById('questionMessage').textContent =
        '🏁 本次遊戲已結束，感謝參與！';
      return;
    }

    if (status === 'active') {
      const questionResponse = await fetch(
        `${API_URL}?join_code=${encodeURIComponent(joinCode)}&action=question`,
        { headers }
      );

      const questionResult = await questionResponse.json();

      if (!questionResult.success) return;

      const q = questionResult.question;

      document.getElementById('waiting').classList.add('hidden');
      document.getElementById('questionPanel').classList.remove('hidden');

      document.getElementById('questionNumber').textContent =
        `第 ${q.question_order} 題`;

      document.getElementById('questionText').textContent =
        q.question_text;

      document.getElementById('optionA').textContent =
        `A. ${q.option_a}`;
      document.getElementById('optionB').textContent =
        `B. ${q.option_b}`;
      document.getElementById('optionC').textContent =
        `C. ${q.option_c}`;
      document.getElementById('optionD').textContent =
        `D. ${q.option_d}`;

      document.getElementById('questionMessage').textContent =
        '請仔細閱讀題目，準備作答！';
    }
  } catch (error) {
    console.error('讀取題目失敗：', error);
  } finally {
    isChecking = false;
  }
}
      event.preventDefault();
      button.disabled = true;
      message.textContent = '正在確認遊戲並加入，請稍候…';

      const join_code = document.getElementById('joinCode').value.trim();
      const nickname = document.getElementById('nickname').value.trim();

      try {
const response = await fetch(API_URL, {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json',
    'apikey': 'sb_publishable_kgSXj6Zbk7QpG4Ien7q6TA_IVfAd-wf'
  },
  body: JSON.stringify({
    action: 'join',
    join_code,
    nickname
  })
});

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || '加入失敗，請稍後再試。');
        }

        form.classList.add('hidden');
        document.getElementById('welcome').textContent =
          `歡迎，${result.player.nickname}！`;
        document.getElementById('waiting').classList.remove('hidden');
        message.textContent = '加入成功！請留在此頁等待主持人開始。';
        if (pollTimer) {
  clearInterval(pollTimer);
}

checkGameQuestion(join_code);

pollTimer = setInterval(() => {
  checkGameQuestion(join_code);
}, 2500);
      } catch (error) {
        message.textContent =
          error.message || '連線失敗，請確認網路後重試。';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
