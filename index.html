      color: #c3c7e7;

    .rank-number {

    .rank-name {

      font-weight: 650;
    }

    .rank-score {

    .rank-empty, #leaderboardMessage {

      color: #d5d7f4;

      font-size: 20px;
    }

    .rank-row:nth-of-type(1) {

/* ===== SK 英雄徽章動畫 ===== */

.sk-logo {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-weight: 900;
  font-style: italic;
  color: #ffe6a0;
  background: linear-gradient(
    135deg,
    #ffffff 5%,
    #d9dce8 30%,
    #ffd66b 55%,
    #fff4ce 75%,
    #c58b24 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px rgba(255, 190, 60, .8));
  isolation: isolate;
  z-index: 1;
}

.sk-logo::before {
  content: "";
  position: absolute;
  inset: -12%;
  border: 3px solid transparent;
  border-top-color: #ffe18a;
  border-bottom-color: #a78bff;
  border-radius: 50%;
  transform: rotate(-25deg);
  animation: skOrbit 5s linear infinite;
  z-index: -1;
}

.sk-logo::after {
  content: "";
  position: absolute;
  inset: -20%;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(113, 75, 255, .35),
    rgba(36, 105, 255, .12) 50%,
    transparent 72%
  );
  animation: skPulse 2.5s ease-in-out infinite;
  z-index: -2;
}

.sk-logo-large {
  width: 150px;
  height: 120px;
  font-size: 82px;
  margin: 12px auto 24px;
}

.sk-logo-small {
  width: 42px;
  height: 38px;
  font-size: 25px;
  margin: 0 8px 0 0;
  vertical-align: middle;
}

@keyframes skOrbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes skPulse {
  0%, 100% {
    opacity: .45;
    transform: scale(.92);
  }
  50% {
    opacity: 1;
    transform: scale(1.12);
  }
}

@media (prefers-reduced-motion: reduce) {
  .sk-logo::before,
  .sk-logo::after {
    animation: none;
  }
}

/* ===== 碩康英雄榮耀榜：完整頒獎舞台 ===== */

#leaderboardPanel {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(117, 73, 255, .38), transparent 55%),
    linear-gradient(160deg, #170b36, #09051c 75%);
  border: 1px solid rgba(255, 215, 120, .45);
  border-radius: 28px;
  padding: 30px 18px;
  box-shadow: 0 0 45px rgba(126, 75, 255, .25);
}

/* 舞台背景光 */
#leaderboardPanel::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 25%, rgba(255, 211, 100, .16), transparent 35%),
    radial-gradient(circle at 15% 65%, rgba(120, 75, 255, .18), transparent 35%),
    radial-gradient(circle at 85% 65%, rgba(120, 75, 255, .18), transparent 35%);
  animation: stageGlow 5s ease-in-out infinite alternate;
}

@keyframes stageGlow {
  from { opacity: .55; }
  to { opacity: 1; }
}

/* ===== 三座獎盃舞台 ===== */

.trophy-podium {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 22px;
  max-width: 850px;
  margin: 35px auto 38px;
  padding: 35px 10px 20px;
  z-index: 1;
}

/* 獎盃光環 */
.trophy-item::before {
  content: "";
  position: absolute;
  width: 135px;
  height: 135px;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  border: 2px solid rgba(255, 215, 100, .7);
  border-left-color: transparent;
  border-right-color: rgba(170, 130, 255, .8);
  border-radius: 50%;
  box-shadow: 0 0 18px rgba(255, 205, 80, .35);
  animation: trophyOrbit 8s linear infinite;
  pointer-events: none;
}

@keyframes trophyOrbit {
  from { transform: translateX(-50%) rotate(0deg); }
  to { transform: translateX(-50%) rotate(360deg); }
}

.trophy-item {
  position: relative;
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px 8px;
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.025));
  animation: trophyFloat 3.5s ease-in-out infinite;
  z-index: 1;
}

.trophy-icon {
  position: relative;
  z-index: 2;
  font-size: 82px;
  line-height: 1.4;
  filter: drop-shadow(0 0 15px currentColor);
  animation: trophyShine 2.5s ease-in-out infinite;
}

@keyframes trophyFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
}

@keyframes trophyShine {
  0%, 100% { filter: drop-shadow(0 0 10px currentColor); }
  50% { filter: drop-shadow(0 0 25px currentColor); }
}

.trophy-rank {
  font-size: 36px;
  font-weight: 900;
  text-shadow: 0 0 15px currentColor;
}

.trophy-label {
  font-size: 20px;
  font-weight: 900;
  margin-top: 5px;
}

.trophy-item.gold {
  min-height: 245px;
  color: #ffdf70;
  border: 2px solid #ffdc70;
  box-shadow: 0 0 35px rgba(255, 205, 55, .4);
}

.trophy-item.silver {
  min-height: 205px;
  color: #e3eaff;
  border: 2px solid #dce8ff;
  box-shadow: 0 0 25px rgba(190, 210, 255, .3);
  animation-delay: .5s;
}

.trophy-item.bronze {
  min-height: 185px;
  color: #f1ad79;
  border: 2px solid #e9a16a;
  box-shadow: 0 0 25px rgba(233, 161, 106, .3);
  animation-delay: 1s;
}

.trophy-item.gold .trophy-icon {
  filter: sepia(1) saturate(3) hue-rotate(350deg) drop-shadow(0 0 18px #ffd65c);
}

.trophy-item.silver .trophy-icon {
  filter: grayscale(1) brightness(1.5) drop-shadow(0 0 18px #dce8ff);
}

.trophy-item.bronze .trophy-icon {
  filter: sepia(1) saturate(3) hue-rotate(335deg) drop-shadow(0 0 18px #e9a16a);
}

/* ===== 金色立體標題 ===== */

#leaderboardPanel > h2 {
  color: #ffe39a;
  font-size: 38px;

/* ===== 背景彩花 ===== */


.confetti-piece {
  position: absolute;
  top: -35px;
  z-index: 5;
  pointer-events: none;
  border-radius: 2px;
  opacity: .95;
  animation-name: confettiFall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}


@keyframes confettiFall {
  0% {
    transform: translate3d(0, -30px, 0) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: 1; }
  90% { opacity: .9; }
  100% {
    transform: translate3d(35px, 850px, 0) rotate(720deg);
    opacity: 0;
  }
}

/* ===== 排行榜玩家卡片 ===== */

#leaderboardRows {
  position: relative;
  z-index: 2;
}

#leaderboardRows .rank-row {
  animation: rankAppear .7s ease both;
}

#leaderboardRows .rank-row:nth-child(1) { animation-delay: .15s; }
#leaderboardRows .rank-row:nth-child(2) { animation-delay: .3s; }
#leaderboardRows .rank-row:nth-child(3) { animation-delay: .45s; }
#leaderboardRows .rank-row:nth-child(4) { animation-delay: .6s; }
#leaderboardRows .rank-row:nth-child(5) { animation-delay: .75s; }

@keyframes rankAppear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== 手機版 ===== */

@media (max-width: 480px) {

  #leaderboardPanel > h2 {
    font-size: 25px;

  }
}

/* 減少動態效果設定 */
@media (prefers-reduced-motion: reduce) {
  .trophy-item,
  .trophy-icon,
  .trophy-item::before,
  #leaderboardPanel::before,
  .confetti-piece,
  #leaderboardRows .rank-row {
    animation: none !important;
  }
}
/* ===== 最終排行榜專屬畫面 ===== */

/* 顯示排行榜時，隱藏登入及加入遊戲區塊 */

main.leaderboard-mode #leaderboardPanel {

main.leaderboard-mode #leaderboardPanel .leaderboard-sub {

/* 保留排行榜內的 SK 動畫，並調整尺寸 */
.leaderboard-mode #leaderboardPanel .sk-logo-large {

/* 隱藏排行榜的額外說明文字 */

  display: none;
}

// ===== 英雄榮耀榜：金紫銀彩花動畫 =====
function createLeaderboardConfetti() {
  const panel = document.getElementById('leaderboardPanel');

  if (!panel || panel.dataset.confettiCreated === 'true') return;

  panel.dataset.confettiCreated = 'true';

  const colors = [
    '#ffd700',
    '#fff0a6',
    '#a78bfa',
    '#c4b5fd',
    '#e5e7eb',
    '#f0c36d'
  ];

  for (let i = 0; i < 45; i++) {
    const piece = document.createElement('div');

    piece.className = 'confetti-piece';

    piece.style.left = `${Math.random() * 100}%`;
    piece.style.backgroundColor =
      colors[Math.floor(Math.random() * colors.length)];

<button id="musicToggle" type="button"
  style="
    display:none;
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9999;
    width:auto;
    padding:12px 20px;
    border-radius:30px;
    background:#292d50;
    color:white;
    border:1px solid #9b8cff;
    font-size:16px;
    cursor:pointer;
  ">
  🔊 關閉音樂
</button>

<script>
(function () {
  const isDesktop =
    window.matchMedia('(min-width: 769px)').matches &&
    window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if (!isDesktop) return;

  const music = document.getElementById('heroMusic');
  const toggle = document.getElementById('musicToggle');

  if (!music || !toggle) return;

  music.volume = 0.35;
  toggle.style.display = 'block';

  let started = false;

  async function startMusic() {
    if (started || music.paused === false) return;

    try {
      await music.play();
      started = true;
      toggle.textContent = '🔊 關閉音樂';
    } catch (error) {
      // 瀏覽器阻擋自動播放時，等待玩家第一次操作
    }
  }

  // 進入登入頁面時，先嘗試自動播放
  startMusic();

  // 若瀏覽器阻擋，第一次操作頁面後再播放
  ['click', 'keydown', 'touchstart'].forEach(eventName => {
    document.addEventListener(eventName, startMusic, {
      once: true
    });
  });

  // 電腦版音樂開關
  toggle.addEventListener('click', async function () {
    if (music.paused) {
      try {
        await music.play();
        started = true;
        toggle.textContent = '🔊 關閉音樂';
      } catch (error) {
        toggle.textContent = '⚠️ 無法播放音樂';
      }
    } else {
      music.pause();
      toggle.textContent = '🔇 開啟音樂';
    }
  });
})();
</script>
