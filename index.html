
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <title>碩康集團英雄集結搶答賽</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 24px;
      font-family: system-ui, "Noto Sans TC", sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #34346b, #11152b 65%);
    }
    main {
      width: 100%; max-width: 420px; padding: 28px 22px;
      border: 1px solid #55547c; border-radius: 24px;
      background: rgba(24, 28, 55, .96);
      box-shadow: 0 20px 60px #0005;
    }
    .symbol { text-align: center; font-size: 46px; }
    h1 { text-align: center; font-size: 25px; margin: 8px 0; }
    .sub { text-align: center; color: #c3c7e7; margin-bottom: 26px; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid #565b80; background: #10142b;
      color: white; font-size: 17px; outline-offset: 3px;
    }
    button {
      width: 100%; padding: 15px; margin-top: 22px;
      border: 0; border-radius: 12px; background: #8165ff;
      color: white; font-size: 18px; font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      min-height: 48px; margin-top: 18px; text-align: center;
      line-height: 1.6; white-space: pre-wrap; color: #e1e3ff;
    }
    .hidden { display: none; }
#questionPanel {
  margin-top: 24px;
}

.option {
  width: 100%;
  color: white;
  cursor: pointer;
  pointer-events: auto;
  padding: 15px;
  margin: 12px 0;
  border: 1px solid #7775a8;
  border-radius: 12px;
  background: #292d50;
  font-size: 16px;
  line-height: 1.5;
}
    .option:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.option:not(:disabled):hover {
  background: #414875;
}

#questionText {
  line-height: 1.6;
  margin: 18px 0;
}

#questionMessage {
  text-align: center;
  color: #c3c7e7;
}

    #leaderboardPanel {
      margin-top: 24px;
      padding: 20px 16px;
      border: 1px solid #7770b5;
      border-radius: 18px;
      background: linear-gradient(160deg, #302b5c, #171b38);
    }
    #leaderboardPanel h2 {
      margin: 0 0 8px;
      text-align: center;
      color: #ffe18a;
    }
    #leaderboardPanel .leaderboard-sub {
      text-align: center;
      color: #d5d7f4;
      margin: 0 0 18px;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      align-items: center;
      gap: 8px;
      margin: 9px 0;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.09);
    }
    .rank-number { font-weight: 800; color: #ffe18a; }
    .rank-name { overflow-wrap: anywhere; font-weight: 650; }
    .rank-score { color: #ffe18a; font-weight: 800; white-space: nowrap; }
    .rank-empty, #leaderboardMessage {
      text-align: center;
      color: #d5d7f4;
      line-height: 1.6;
    }
    .rank-row:nth-of-type(1) { border: 1px solid #d9b94f; }

  </style>
</head>
<body>
  <main>
    <div class="symbol">⚡</div>
    <h1>英雄集結搶答賽</h1>
    <p class="sub">碩康集團 · 歡迎加入挑戰</p>
    <p id="message" style="color:#ffb4b4; margin:10px 0;"></p>

    <form id="joinForm">
      <label for="joinCode">遊戲代碼</label>
      <input id="joinCode" value="SK2026" maxlength="30"
        autocomplete="off" required>

      <label for="nickname">玩家暱稱（最多 20 字）</label>
      <input id="nickname" maxlength="20" autocomplete="nickname"
        placeholder="請輸入你的暱稱" required>

      <button id="joinButton" type="submit">加入遊戲</button>

      <button id="viewLeaderboardButton" type="button">
       🏆 查看最終排行榜
      </button>
    </form>
<section id="questionPanel" class="hidden">
  <p class="sub">⚡ 英雄挑戰開始！</p>
  <h2 id="questionNumber">第 1 題</h2>
  <h2 id="questionText"></h2>

<div id="options">
  <button class="option" id="optionA" type="button"></button>
  <button class="option" id="optionB" type="button"></button>
  <button class="option" id="optionC" type="button"></button>
  <button class="option" id="optionD" type="button"></button>
</div>

  <p id="questionMessage">請仔細閱讀題目！</p>
</section>

    <section id="leaderboardPanel" class="hidden" aria-live="polite">
      <div class="symbol">🏆</div>
      <h2>英雄榮耀榜 TOP 5</h2>
      <p class="leaderboard-sub">本次搶答賽最終排名</p>
      <div id="leaderboardRows"></div>
      <p id="leaderboardMessage">正在整理最終成績…</p>
      <p class="leaderboard-sub">感謝所有英雄玩家的熱情參與！</p>
    </section>

    <section id="waiting" class="hidden">
      <h2 id="welcome"></h2>
      <p>已成功加入，請等待主持人開始遊戲。</p>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
  </main>


<script>
  const API_URL =
    'https://krtktutoycdfcskhpmam.supabase.co/functions/v1/game-api';

  const API_KEY =
    'sb_publishable_kgSXj6Zbk7QpG4Ien7q6TA_IVfAd-wf';

  const form = document.getElementById('joinForm');
  const joinButton = document.getElementById('joinButton');
  const message = document.getElementById('message');
  const questionPanel = document.getElementById('questionPanel');
  const waiting = document.getElementById('waiting');
  const questionMessage = document.getElementById('questionMessage');

  const leaderboardPanel = document.getElementById('leaderboardPanel');
  const leaderboardRows = document.getElementById('leaderboardRows');
  const leaderboardMessage = document.getElementById('leaderboardMessage');
  let leaderboardLoaded = false;

  // 遊戲結束後，讀取本場次前五名
  async function loadFinalLeaderboard(joinCode) {
    if (leaderboardLoaded) return;

    leaderboardPanel.classList.remove('hidden');
    questionPanel.classList.add('hidden');
    waiting.classList.add('hidden');
    leaderboardMessage.textContent = '正在整理最終成績…';

    try {
      const headers = { 'apikey': API_KEY };

// 透過 game-api 取得本場次 ID
const sessionResponse = await fetch(
  `${API_URL}?join_code=${encodeURIComponent(joinCode)}&_=${Date.now()}`,
  {
    headers,
    cache: 'no-store'
  }
);

const sessionResult = await sessionResponse.json();

if (!sessionResponse.ok || !sessionResult.success || !sessionResult.session) {
  throw new Error(
    sessionResult.message || '無法取得本場次資料，請聯絡主持人。'
  );
}

const sessionId = sessionResult.session.id;
const baseUrl = API_URL.replace('/functions/v1/game-api', '');
      
// 透過 game-api 取得最終前五名
const leaderboardUrl =
  `${API_URL}?action=leaderboard&join_code=${encodeURIComponent(joinCode)}&_=${Date.now()}`;

const leaderboardResponse = await fetch(leaderboardUrl, {
  headers: { 'apikey': API_KEY },
  cache: 'no-store'
});

const leaderboardResult = await leaderboardResponse.json();

if (!leaderboardResponse.ok || !leaderboardResult.success) {
  throw new Error(
    leaderboardResult.message || '讀取排行榜失敗'
  );
}

const players = leaderboardResult.players || [];

      leaderboardRows.replaceChildren();

      if (!players.length) {
        leaderboardRows.innerHTML =
          '<p class="rank-empty">本場次尚無玩家成績。</p>';
      } else {
        let previousScore = null;
        let previousCorrect = null;
        let rank = 0;

        players.forEach((player, index) => {
          const score = Number(player.total_score) || 0;
          const correct = Number(player.correct_count) || 0;

          if (score !== previousScore || correct !== previousCorrect) {
            rank = index + 1;
          }
          previousScore = score;
          previousCorrect = correct;

          const row = document.createElement('div');
          row.className = 'rank-row';

          const rankEl = document.createElement('span');
          rankEl.className = 'rank-number';
          rankEl.textContent = ['🥇', '🥈', '🥉'][rank - 1] || `第 ${rank} 名`;

          const nameEl = document.createElement('span');
          nameEl.className = 'rank-name';
          nameEl.textContent = player.nickname || '未命名玩家';

          const scoreEl = document.createElement('span');
          scoreEl.className = 'rank-score';
          scoreEl.textContent = `${score.toLocaleString('zh-TW')} 分`;

          row.append(rankEl, nameEl, scoreEl);
          leaderboardRows.appendChild(row);
        });
      }

      leaderboardMessage.textContent = '遊戲已結束，恭喜以上英雄玩家！';
      leaderboardLoaded = true;
    } catch (error) {
      console.error('讀取最終排行榜失敗：', error);
      leaderboardMessage.textContent =
        `${error.message}（系統將稍後重新嘗試）`;
    }
  }

  
// 查看最終排行榜按鈕
document.getElementById('viewLeaderboardButton')
  .addEventListener('click', async () => {

    const joinCode =
      document.getElementById('joinCode').value.trim();

    const message = document.getElementById('message');

    if (!joinCode) {
      message.textContent = '請先輸入遊戲代碼';
      return;
    }

    message.textContent = '正在查詢遊戲場次…';

    try {
      const response = await fetch(
        `${API_URL}?join_code=${encodeURIComponent(joinCode)}&_=${Date.now()}`,
        {
          headers: { 'apikey': API_KEY },
          cache: 'no-store'
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || '查詢遊戲失敗');
      }

      if (result.session.status !== 'ended') {
        message.textContent = '本場遊戲尚未結束，目前無法查看最終排行榜。';
        return;
      }

      // 確認遊戲已結束，直接讀取排行榜
      await loadFinalLeaderboard(joinCode);

      if (leaderboardLoaded) {
        document.getElementById('joinForm')
          .classList.add('hidden');
      }

    } catch (error) {
      message.textContent = error.message || '排行榜讀取失敗';
      console.error('排行榜查詢失敗：', error);
    }
  });


  const optionButtons = [
    document.getElementById('optionA'),
    document.getElementById('optionB'),
    document.getElementById('optionC'),
    document.getElementById('optionD')
  ];

  let pollTimer = null;
  let isChecking = false;
  let currentPlayerId = null;
  let currentJoinCode = null;

  // 記錄目前題目及是否已經作答
  let currentQuestionOrder = null;
  let hasAnswered = false;

  // 鎖定或開放所有答案選項
  function setOptionsDisabled(disabled) {
    optionButtons.forEach(button => {
      button.disabled = disabled;
    });
  }

  // 玩家送出答案
  async function submitAnswer(selectedOption) {
    if (!currentPlayerId || hasAnswered) return;

    // 先鎖定，避免玩家連續點擊
    hasAnswered = true;
    setOptionsDisabled(true);

    questionMessage.textContent = '答案送出中，請稍候…';

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': API_KEY
        },
        body: JSON.stringify({
          action: 'answer',
          join_code: currentJoinCode,
          player_id: currentPlayerId,
          selected_option: selectedOption
        })
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || '答案送出失敗');
      }

      questionMessage.textContent =
        `${result.message} 本題獲得 ${result.earned_points} 分！`;

    } catch (error) {
      // 不直接解除鎖定，避免網路錯誤時重複送出答案
      hasAnswered = true;
      setOptionsDisabled(true);

      questionMessage.textContent =
        `${error.message}（請等待下一題或聯絡主持人）`;
    }
  }

  // 綁定四個答案按鈕
  optionButtons.forEach((button, index) => {
    button.addEventListener('click', () => {
      submitAnswer(index);
    });
  });

  // 定期檢查遊戲狀態及題目
  async function checkGameQuestion(joinCode) {
    if (isChecking) return;

    isChecking = true;

    try {
      const headers = {
        'apikey': API_KEY
      };

      // 先取得遊戲場次狀態
const sessionResponse = await fetch(
  `${API_URL}?join_code=${encodeURIComponent(joinCode)}&_=${Date.now()}`,
  {
    headers,
    cache: 'no-store'
  }
);


      const sessionResult = await sessionResponse.json();

      if (!sessionResponse.ok || !sessionResult.success) {
        return;
      }

      const status = sessionResult.session.status;

      // 等待遊戲開始
      if (status === 'lobby') {
        setOptionsDisabled(true);
        questionMessage.textContent = '等待主持人開始遊戲…';
        return;
      }

      // 遊戲暫停
      if (status === 'paused') {
        setOptionsDisabled(true);
        questionMessage.textContent =
          '⏸ 遊戲暫停中，請稍候！';
        return;
      }

      // 遊戲結束：玩家頁面顯示最終前五名
      if (status === 'ended') {
        setOptionsDisabled(true);
        await loadFinalLeaderboard(joinCode);

        if (leaderboardLoaded && pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }

        return;
      }

      // 只有遊戲進行中才讀取題目
      if (status === 'active') {
        const questionResponse = await fetch(
          `${API_URL}?join_code=${encodeURIComponent(joinCode)}&action=question`,
          { headers }
        );

        const questionResult = await questionResponse.json();

if (!questionResponse.ok || !questionResult.success) {
  setOptionsDisabled(true);

  questionMessage.textContent =
    questionResult.message || '目前無法取得題目，請稍候。';

  console.error('讀取題目失敗：', questionResult);

  return;
}
        const q = questionResult.question;

        // 判斷是否已經切換到新題目
        const isNewQuestion =
          currentQuestionOrder !== q.question_order;

        if (isNewQuestion) {
          currentQuestionOrder = q.question_order;
          hasAnswered = false;

          questionMessage.textContent =
            '請仔細閱讀題目，準備作答！';
        }

        // 顯示題目
        waiting.classList.add('hidden');
        questionPanel.classList.remove('hidden');

        document.getElementById('questionNumber').textContent =
          `第 ${q.question_order} 題`;

        document.getElementById('questionText').textContent =
          q.question_text;

        document.getElementById('optionA').textContent =
          `A. ${q.option_a}`;

        document.getElementById('optionB').textContent =
          `B. ${q.option_b}`;

        document.getElementById('optionC').textContent =
          `C. ${q.option_c}`;

        document.getElementById('optionD').textContent =
          `D. ${q.option_d}`;

        // 同一題已作答就維持鎖定
        setOptionsDisabled(hasAnswered);
      }

    } catch (error) {
      console.error('讀取題目失敗：', error);
    } finally {
      isChecking = false;
    }
  }

  // 玩家加入遊戲
  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    joinButton.disabled = true;
    message.textContent = '正在確認遊戲並加入，請稍候…';

    const joinCode =
      document.getElementById('joinCode').value.trim();

    const nickname =
      document.getElementById('nickname').value.trim();

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': API_KEY
        },
        body: JSON.stringify({
          action: 'join',
          join_code: joinCode,
          nickname: nickname
        })
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || '加入失敗，請稍後再試。');
      }

      currentPlayerId = result.player.id;
      currentJoinCode = joinCode;

      form.classList.add('hidden');

      document.getElementById('welcome').textContent =
        `歡迎，${result.player.nickname}！`;

      waiting.classList.remove('hidden');

      message.textContent =
        '加入成功！請留在此頁等待主持人開始。';

      if (pollTimer) {
        clearInterval(pollTimer);
      }

      // 立即檢查一次，再每 2.5 秒更新
      checkGameQuestion(joinCode);

      pollTimer = setInterval(() => {
        checkGameQuestion(joinCode);
      }, 2500);

    } catch (error) {
      message.textContent =
        error.message || '連線失敗，請確認網路後重試。';

    } finally {
      joinButton.disabled = false;
    }
  });
</script>

</body>
</html>
